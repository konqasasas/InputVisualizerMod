buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:4.1.7'
    }
    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'net.minecraftforge' && details.requested.name == 'mergetool') {
                details.useVersion '0.2.3.3'
                details.because 'mergetool 1.x can generate a broken Forge 1.12.2 Side enum'
            }
        }
    }
}
        
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'net.minecraftforge' && details.requested.name == 'mergetool') {
            details.useVersion '0.2.3.3'
            details.because 'mergetool 1.x can generate a broken Forge 1.12.2 Side enum'
        }
    }
}

version = '1.0.0'
group = 'com.konqasasas.inputvisualizer' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'inputvisualizer'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

minecraft {


    // The mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   Snapshot are built nightly.
    // stable_#            Stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    //mappings channel: 'snapshot', version: '20171003-1.12'
    mappings channel: 'snapshot', version: '20171003-1.12'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }

        server {
            workingDirectory project.file('run-server')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'
    filesMatching('mcmod.info') {
        expand version: project.version, mcversion: '1.12.2'
    }
}

task fixForgeSideEnum {
    group = 'forge'
    description = 'Replace broken FML Side.class in generated Forge jars with the class from the Forge universal jar.'

    doLast {
        def forgeVersion = '1.12.2-14.23.5.2859'
        def mappedVersion = "${forgeVersion}_mapped_snapshot_20171003-1.12"
        def forgeGradleCache = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle')
        def universalJar = new File(forgeGradleCache, "maven_downloader/net/minecraftforge/forge/${forgeVersion}/forge-${forgeVersion}-universal.jar")

        if (!universalJar.isFile()) {
            throw new GradleException("Forge universal jar not found: ${universalJar}")
        }

        def sidePath = 'net/minecraftforge/fml/relauncher/Side.class'
        def sideTempDir = new File(buildDir, 'tmp/fixForgeSideEnum')
        delete sideTempDir
        copy {
            from zipTree(universalJar)
            include sidePath
            into sideTempDir
        }

        def replacement = new File(sideTempDir, sidePath)
        if (!replacement.isFile()) {
            throw new GradleException("Side.class not found in Forge universal jar: ${universalJar}")
        }

        def generatedRepo = new File(forgeGradleCache, "minecraft_user_repo/net/minecraftforge/forge/${mappedVersion}")
        def generatedJars = fileTree(generatedRepo) {
            include "forge-${mappedVersion}.jar"
            include "forge-${mappedVersion}-recomp.jar"
        }.files

        if (generatedJars.empty) {
            throw new GradleException("Generated Forge jars not found under: ${generatedRepo}")
        }

        generatedJars.each { jarFile ->
            ant.zip(destfile: jarFile, update: true) {
                fileset(dir: sideTempDir, includes: sidePath)
            }
            logger.lifecycle("Patched ${sidePath} in ${jarFile}")
        }
    }
}

tasks.matching { it.name == 'runServer' }.all {
    dependsOn fixForgeSideEnum
    fixForgeSideEnum.mustRunAfter compileJava
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'

    // You may put jars on which you depend on in ./libs or you may define them like so..
    // compile "some.group:artifact:version:classifier"
    // compile "some.group:artifact:version"

    // Real examples
    // compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    // compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // The 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    // provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // These dependencies get remapped to your current MCP mappings
    // deobf 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
            "Specification-Title": "InputVisualizer",
            "Specification-Vendor": "konqasasas",
            "Specification-Version": "${version}", // We are version 1 of ourselves
            "Implementation-Title": "InputVisualizer",
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"konqasasas",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}




// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar') 
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
